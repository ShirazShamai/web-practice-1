<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-5 rounded-lg shadow-lg w-80">
        <h1>Login</h1>
        <form id="loginForm" action="/src/login" method="post">
            <label for="userInput">Username or Email</label>
            <input type="text" id="userInput" required class="w-full p-3 my-2 border border-gray-300 rounded">
            <label for="passInput">Password</label>
            <input type="password" id="passInput" required class="w-full p-3 my-2 border border-gray-300 rounded">
            <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Login</button>

        </form>
        <div id="loginMessage" class="mt-2 text-red-500 text-center text-sm"></div>
        <a href="register.html"
            class="block text-center w-full p-3 mt-4 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">Register</a>
        <a href="#" class="block text-right mt-4 text-blue-500 hover:underline"
            onclick="alert('Forgot password functionality to be implemented.');">Forgot Password?</a>


    </div>
    <script src="login.js"></script>
    <script src="users.js"></script>

</body>

</html>
