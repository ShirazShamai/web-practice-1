<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-5 rounded-lg shadow-lg w-80">
        <form id="registerForm" action="/src/register.html" method="post">
            <label for="userInput">Username</label>
            <input type="text" id="userInput" required class="w-full p-3 my-2 border border-gray-300 rounded" />
            <label for="mailInput">Email</label>
            <input type="email" id="mailInput" required class="w-full p-3 my-2 border border-gray-300 rounded" />
            <label for="passInput">Password</label>
            <input type="password" id="passInput" required class="w-full p-3 my-2 border border-gray-300 rounded" />
            <label for="passInput2">Confirm Password</label>
            <input type="password" id="passInput2" required class="w-full p-3 my-2 border border-gray-300 rounded" />
            <label for="dateInput">Date of Birth</label>
            <input type="date" id="dateInput" required class="w-full p-3 my-2 border border-gray-300 rounded" />
            <div id="arithmetic-captcha-container" class="space-y-2">
                <label for="captcha-answer" class="block text-sm font-medium text-gray-700"> Solve the CAPTCHA: </label>
                <div class="flex items-center space-x-4">
                    <span id="arithmetic-challenge" class="text-lg font-semibold text-gray-800"></span>
                    <button type="button" id="refresh-arithmetic-captcha" title="Refresh CAPTCHA">
                        <img class="h-10" src="https://logosandtypes.com/wp-content/uploads/2024/01/recaptcha.svg"
                            alt="CAPTCHA">
                    </button>
                </div>
                <input type="text" id="arithmetic-answer" name="arithmetic-answer"
                    class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                    placeholder="Enter the answer">
                <p id="arithmetic-error" class="mt-1 text-sm text-red-500 hidden">Incorrect CAPTCHA answer.</p>
                <p id="captcha-attempts-error" class="mt-1 text-sm text-red-500 hidden">
                    Too many incorrect CAPTCHA attempts.
                </p>
            </div>
            <div class="flex justify-center my-4">
                <div class="g-recaptcha" data-sitekey="6Le_zCwuAAAAAL-LZSrHDh23iaxoCLGWKEMdNcGF"></div>
            </div>

            <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Register</button>


        </form>
        <div id="registerMessage" class="mt-2 text-red-500 text-center text-sm"></div>
        <script src="captcha.js"></script>

    </div>
    <script src="users.js"></script>
</body>

</html>
